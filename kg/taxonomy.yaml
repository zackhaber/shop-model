  - {id: bath-linen, name: Bath linen, is_a: home-textiles}

  - {id: home-decor, name: Home decor}
  - {id: lighting, name: Lighting, is_a: home-decor}
  - {id: clocks, name: Clocks, is_a: home-decor}
  - {id: wall-art, name: Wall art, is_a: home-decor}
  - {id: vases, name: Vases, is_a: home-decor}
  - {id: candles-fragrance, name: Candles and home fragrance, is_a: home-decor}
  - {id: candles, name: Candles, is_a: candles-fragrance}
  - {id: home-fragrance, name: Home fragrance, is_a: candles-fragrance}
  - {id: decorative-accessories, name: Decorative accessories, is_a: home-decor}
  - {id: candle-holders, name: Candle holders, is_a: decorative-accessories}

  - {id: garden, name: Garden}
