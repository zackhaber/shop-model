# The shop's product taxonomy (Session 7, Stage 16).
# Fictitious: written for this unit from the shop's own listings, with department names
# in the style of published retail taxonomies.
#
# Up to three levels: department, category, subcategory. Every concept except a department
# "is a" kind of its broader concept, so anything true of all kitchen and dining products is
# true of every drinkware product, two steps down. The hierarchy is deliberately uneven: some
# categories have subcategories and some do not. Which category a product is in is recorded
# in kg/product_categories.csv, not here.

concepts:
  - {id: kitchen-dining, name: Kitchen and dining}
  - {id: cookware, name: Cookware, is_a: kitchen-dining}
  - {id: bakeware, name: Bakeware, is_a: cookware}
  - {id: pots-casseroles, name: Pots and casseroles, is_a: cookware}
  - {id: tableware, name: Tableware, is_a: kitchen-dining}
  - {id: dinnerware, name: Dinnerware, is_a: tableware}
  - {id: drinkware, name: Drinkware, is_a: tableware}
  - {id: serveware, name: Serveware, is_a: tableware}
  - {id: tea-coffee, name: Tea and coffee, is_a: tableware}
  - {id: table-accessories, name: Table accessories, is_a: tableware}
  - {id: table-linen, name: Table linen, is_a: tableware}
  - {id: kitchen-tools, name: Kitchen tools, is_a: kitchen-dining}
  - {id: utensils, name: Utensils, is_a: kitchen-tools}
  - {id: food-preparation, name: Food preparation, is_a: kitchen-tools}
  - {id: kitchen-textiles, name: Kitchen textiles, is_a: kitchen-dining}
  - {id: kitchen-storage, name: Kitchen storage, is_a: kitchen-dining}
  - {id: barware, name: Barware, is_a: kitchen-dining}

  - {id: home-textiles, name: Home textiles}
