  - {id: stationery-gifts, name: Stationery and gifts}
  - {id: stationery, name: Stationery, is_a: stationery-gifts}
  - {id: cards-wrapping, name: Cards and wrapping, is_a: stationery-gifts}
  - {id: cards, name: Cards, is_a: cards-wrapping}
  - {id: gift-wrap, name: Gift wrap, is_a: cards-wrapping}
