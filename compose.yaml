include:
  - monitoring/compose.yaml

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: shop
    volumes:
      - db-data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shop", "-d", "shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: shop-model:${MODEL_VERSION:-dev}
    ports:
      - "8888:8888"
    environment:
      MODEL_VERSION: "${MODEL_VERSION:-dev}"

volumes:
  db-data:
